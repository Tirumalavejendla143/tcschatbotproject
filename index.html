
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h2>🤖 TCS AI</h2>
            <button id="new-chat" class="new-chat">+ New Chat</button>
            <p class="sidebar-label">Your assistant</p>
            <p class="sidebar-note">Ask questions about your TCS PDF document.</p>
            <div class="sidebar-footer">Powered by GenAI + RAG</div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h3>TCS Document Assistant</h3>
                    <p>Chat with your PDF using AI</p>
                </div>
                <span class="status"><span class="dot"></span> AI Assistant</span>
            </header>

            <section id="chat" class="chat">
                <div id="welcome" class="welcome">
                    <div class="welcome-icon">✦</div>
                    <h1>How can I help you?</h1>
                    <p>Ask a question about the information in your TCS PDF.</p>

                    <div class="suggestions">
                        <button class="suggestion"
                            data-question="Summarize the TCS document">
                            Summarize the document
                        </button>
                        <button class="suggestion"
                            data-question="What are the main topics in the document?">
                            Main topics
                        </button>
                        <button class="suggestion"
                            data-question="Explain the important information in simple words">
                            Explain in simple words
                        </button>
                    </div>
                </div>

                <div id="messages" class="messages"></div>
            </section>

            <div class="composer-area">
                <form id="chat-form" class="composer">
                    <textarea id="question"
                        placeholder="Ask anything about your TCS document..."
                        rows="1" required></textarea>
                    <button id="send-btn" type="submit" aria-label="Send message">
                        ➤
                    </button>
                </form>
                <p class="disclaimer">
                    AI can make mistakes. Verify important information.
                </p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
