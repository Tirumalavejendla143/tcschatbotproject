
<script>
  const form = document.getElementById("chatForm");
  const input = document.getElementById("question");
  const chat = document.getElementById("chat");
  const statusText = document.getElementById("status");
  const send = document.getElementById("send");

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    send.disabled = true;
    statusText.textContent = "Getting an answer...";

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "Request failed (" + response.status + ")"
        );
      }

      const answer =
        data.answer || data.response || data.message || "";

      const sourceText =
        Array.isArray(data.sources) && data.sources.length
          ? "\n\nSources: " + data.sources.map(s =>
              `${s.source || "TCS PDF"} (page ${s.page ?? "unknown"})`
            ).join(", ")
          : "";

      addMessage(
        (answer || JSON.stringify(data)) + sourceText,
        "bot"
      );

      statusText.textContent = "Response received.";
    } catch (error) {
      addMessage(
        "Could not connect to the chatbot backend. " + error.message,
        "bot"
      );
      statusText.textContent = "Backend connection failed.";
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
